[package]
name = "blurt"
description = "A small, fast, native Mumble client"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
blurt-audio = { path = "../blurt-audio" }
chrono = "0.4.45"
directories = "6"
env_logger = "0.11"
# tokio, because mumble-protocol spawns its connection tasks on it.
iced = { version = "0.14", default-features = false, features = ["tiny-skia", "wayland", "x11", "tokio", "crisp", "canvas"] }
log = "0.4"
mumble-protocol = { path = "../mumble-protocol" }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1.53", features = ["rt", "sync"] }
toml = "1"

[features]
# The native PipeWire audio host (needs libpipewire-0.3 and libclang to build).
default = ["pipewire", "gpu"]
pipewire = ["blurt-audio/pipewire"]
# "Rich visuals": able to render with the GPU (wgpu) as well as the CPU
# (tiny-skia), for the room glow. Which one draws is a setting, picked at
# startup; tiny-skia stays the default where memory is short, since blurt's
# UI is mostly text, which it draws with far less memory.
gpu = ["iced/wgpu", "iced/advanced"]

[dev-dependencies]
iced_test = "0.14"
naga = { version = "27.0.3", features = ["wgsl-in"] }

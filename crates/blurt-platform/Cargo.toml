[package]
name = "blurt-platform"
description = "Desktop integration for blurt: system tray and global hotkeys"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
futures-channel = "0.3.34"
futures-util = "0.3.34"
log = "0.4"

[target.'cfg(target_os = "linux")'.dependencies]
# The XDG GlobalShortcuts portal; tokio, as the app's async runtime is.
ashpd = { version = "0.14", default-features = false, features = ["tokio", "global_shortcuts"] }

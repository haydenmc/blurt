[package]
name = "blurt-platform"
description = "Desktop integration for blurt: system tray, global hotkeys and universal mute"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
futures-channel = "0.3.34"
futures-util = "0.3.34"
log = "0.4"

[target.'cfg(target_os = "linux")'.dependencies]
# The XDG GlobalShortcuts portal; tokio, as the app's async runtime is.
ashpd = { version = "0.13", default-features = false, features = ["tokio", "global_shortcuts"] }
ksni = { version = "0.3.7", default-features = false, features = ["tokio"] }

[target.'cfg(windows)'.dependencies]
# The notification area icon; already in the build through winit and tokio.
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_LibraryLoader",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_HiDpi",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
# Universal mute (the taskbar's microphone button) is WinRT; the build
# already has this crate through cpal.
windows = { version = "0.62", default-features = false, features = [
  "ApplicationModel_Calls",
  "Foundation",
  "Win32_System_WinRT",
] }

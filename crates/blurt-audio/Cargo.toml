[package]
name = "blurt-audio"
description = "Real-time audio engine for blurt: capture, DSP, Opus, jitter buffering, mixing"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
cpal = { version = "0.18.2", features = ["pulseaudio"] }
log = "0.4"
nnnoiseless = { version = "0.5.2", default-features = false }
opus = "0.4.0"
rtrb = "0.4.1"
rubato = "1"
sonora = "0.3"
# sonora's internal neural voice detector, which sonora itself doesn't expose.
sonora-agc2 = "0.3"
sonora-simd = "0.3"
thiserror = "2"

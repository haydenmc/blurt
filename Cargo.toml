[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.3.0"
edition = "2024"
license = "AGPL-3.0-or-later"
rust-version = "1.90"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[profile.dev.package."*"]
# Optimize dependencies in dev so audio DSP and rendering run at usable speed.
opt-level = 2

# Large crates that aren't hot (blurt draws little, and D-Bus carries a
# few messages) are optimized for size, so rich visuals and desktop
# integration fit the binary budget. Audio DSP keeps opt-level 3.
[profile.release.package.naga]
opt-level = "z"
[profile.release.package.wgpu-core]
opt-level = "z"
[profile.release.package.wgpu-hal]
opt-level = "z"
[profile.release.package.wgpu]
opt-level = "z"
[profile.release.package.iced_wgpu]
opt-level = "z"
[profile.release.package.zbus]
opt-level = "z"
[profile.release.package.ashpd]
opt-level = "z"
[profile.release.package.zvariant]
opt-level = "z"
[profile.release.package.ksni]
opt-level = "z"

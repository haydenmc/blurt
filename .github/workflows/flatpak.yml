name: Flatpak

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  # The generator needs python packages the Flatpak image doesn't have.
  cargo-sources:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install generator dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-aiohttp python3-tomlkit
      - run: scripts/flatpak-sources.sh
      - uses: actions/upload-artifact@v4
        with:
          name: cargo-sources
          path: packaging/flatpak/cargo-sources.json

  bundle:
    needs: cargo-sources
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-26.08
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: cargo-sources
          path: packaging/flatpak
      - name: Validate desktop file and AppStream metadata
        run: |
          desktop-file-validate packaging/io.github.haydenmc.blurt.desktop
          appstreamcli validate --no-net packaging/io.github.haydenmc.blurt.metainfo.xml
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: blurt.flatpak
          manifest-path: packaging/flatpak/io.github.haydenmc.blurt.yml
          cache-key: flatpak-builder-${{ hashFiles('Cargo.lock', 'packaging/flatpak/*.yml') }}
          upload-artifact: false
      - uses: actions/upload-artifact@v4
        with:
          name: flatpak
          path: blurt.flatpak

name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config cmake libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libx11-xcb-dev libfontconfig-dev libasound2-dev libopus-dev \
            libpipewire-0.3-dev libspa-0.2-dev libclang-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets
      # The default build has rich visuals (gpu); check the CPU-only one too.
      - run: cargo clippy -p blurt --no-default-features
      - run: cargo test --workspace
      - name: Release build within the 20 MB budget
        run: |
          cargo build --release --locked -p blurt
          size=$(stat -c %s target/release/blurt)
          echo "blurt is $((size / 1024)) KiB"
          if [ "$size" -gt $((20 * 1000 * 1000)) ]; then
            echo "Release binary is over the 20 MB budget" >&2
            exit 1
          fi
